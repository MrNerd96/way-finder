<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b6b4f">
<title>Way Finder</title>
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="css/app.css?v=32">
</head>
<body>

<div id="app">

  <header id="topbar">
    <div class="brand">
      <strong id="brandName">Way Finder</strong>
      <span id="brandSub">Way Finder</span>
    </div>
    <div class="topActions">
      <select id="langSel" aria-label="Language">
        <option value="en">English</option>
        <option value="te">తెలుగు</option>
        <option value="hi">हिंदी</option>
      </select>
      <button id="modeBtn" class="ghost" type="button">Survey</button>
    </div>
  </header>

  <!-- Floor strip: shared by both modes -->
  <div id="floorStrip" class="floorStrip"></div>

  <!-- The map is always mounted; both modes draw into it -->
  <div id="mapWrap">
    <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
      <g id="layerPlan"><image id="planImg" x="0" y="0" preserveAspectRatio="none"></image></g>
      <g id="layerEdges"></g>
      <g id="layerRoute"></g>
      <g id="layerNodes"></g>
      <g id="layerLabels"></g>
    </svg>
    <div id="mapHint" class="mapHint" hidden></div>
    <button id="fitBtn" class="fab" type="button" title="Fit to screen">⤢</button>
  </div>

  <!-- Survey toolbar, hidden in Go mode -->
  <div id="surveyBar" hidden>
    <div class="tools" role="group" aria-label="Survey tools">
      <button class="tool" data-tool="select" type="button"><span>✋</span>Select</button>
      <button class="tool" data-tool="room" type="button"><span>🚪</span>Room</button>
      <button class="tool" data-tool="point" type="button"><span>📍</span>Point</button>
      <button class="tool" data-tool="link" type="button"><span>🔗</span>Connect</button>
      <button class="tool" data-tool="move" type="button"><span>✥</span>Move</button>
      <button class="tool" data-tool="erase" type="button"><span>🗑</span>Delete</button>
    </div>
    <div class="tools secondary">
      <button id="undoBtn" class="tool" type="button" title="Ctrl+Z"><span>↩</span>Undo</button>
      <button id="redoBtn" class="tool" type="button" title="Ctrl+Shift+Z"><span>↪</span>Redo</button>
      <button id="copyBtn" class="tool" type="button" title="Ctrl+C"><span>⧉</span>Copy</button>
      <button id="pasteBtn" class="tool" type="button" title="Ctrl+V"><span>⬚</span>Paste</button>
      <button id="calBtn" class="tool" type="button"><span>📏</span>Scale</button>
      <button id="addFloorBtn" class="tool" type="button"><span>🏢</span>Add floor</button>
      <button id="exportBtn" class="tool" type="button" title="The whole map as a data.js — your backup"><span>⬇</span>Export</button>
      <button id="changesBtn" class="tool" type="button" title="Only what you have changed since the published map — small enough to send"><span>📤</span>Changes</button>
      <button id="importBtn" class="tool" type="button"><span>⬆</span>Import</button>
      <button id="autoRoomsBtn" class="tool" type="button" title="Add the rectangles detected on the printed plan"><span>✨</span>Auto rooms</button>
      <input id="importFile" type="file" accept=".js,.json,application/json,text/javascript" hidden>
      <input id="planFile" type="file" accept="image/*" hidden>
    </div>
    <p id="surveyStatus" class="surveyStatus"></p>
  </div>

  <!-- Bottom sheet: the whole Go-mode flow lives here -->
  <div id="sheet"></div>

</div>

<!-- Full screen searchable picker -->
<div id="picker" class="overlay" hidden>
  <div class="pickerBox">
    <header>
      <button id="pickerClose" class="ghost" type="button">✕</button>
      <h2 id="pickerTitle"></h2>
    </header>
    <input id="pickerInput" type="search" autocomplete="off" placeholder="Room number or department">
    <ul id="pickerList"></ul>
  </div>
</div>

<!-- Node editor -->
<div id="editor" class="overlay" hidden>
  <form id="editorForm" class="editorBox">
    <header>
      <button id="editorClose" class="ghost" type="button">✕</button>
      <h2 id="editorTitle">Edit point</h2>
    </header>
    <div class="fields"></div>
    <footer>
      <button id="editorDelete" class="danger" type="button">Delete</button>
      <button id="editorNext" class="neutral" type="button" hidden>Save &amp; next ›</button>
      <button class="primary" type="submit">Save</button>
    </footer>
  </form>
</div>

<div id="toast" class="toast" hidden></div>

<script src="js/i18n.js?v=32"></script>
<script src="js/data.js?v=32"></script>
<script src="js/detected.js?v=32"></script>
<script src="js/store.js?v=32"></script>
<script src="js/graph.js?v=32"></script>
<script src="js/mapview.js?v=32"></script>
<script src="js/navigate.js?v=32"></script>
<script src="js/survey.js?v=32"></script>
<script src="js/app.js?v=32"></script>
</body>
</html>
